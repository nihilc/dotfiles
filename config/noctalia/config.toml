[shell]
app_icon_color = "on_surface_variant"
avatar_path = "/home/nihilc/Pictures/Wallpapers/gifs/reze-eye.gif"
font_family = "Inter"
polkit_agent = true

    [shell.launcher]
    categories = false

    [shell.mpris]
    blacklist = [ "firefox" ]

    [shell.panel]
    clipboard_placement = "attached"
    launcher_placement = "attached"
    launcher_position = "top_center"

    [[shell.session.actions]]
